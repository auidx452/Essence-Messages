<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>聊天记录</title>
  <style>
    :root {
      --bg: #f5f5f5;
      --header-bg: #ededed;
      --self-bubble: #95ec69;
      --other-bubble: #ffffff;
      --text: #191919;
      --muted: #9a9a9a;
      --line: #d9d9d9;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
      background: #d2d2d2;
      display: flex;
      justify-content: center;
      min-height: 100vh;
      padding: 24px 8px;
    }
    .phone {
      width: 100%;
      max-width: 420px;
      height: 86vh;
      background: var(--bg);
      border-radius: 18px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 8px 40px rgba(0,0,0,.25);
    }
    .chat-header {
      background: var(--header-bg);
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid var(--line);
      flex-shrink: 0;
    }
    .chat-header a.back { color: #555; font-size: 18px; text-decoration: none; }
    .chat-header .title {
      flex: 1;
      text-align: center;
      font-size: 16px;
      font-weight: 600;
      color: var(--text);
    }
    .chat-header .more { color: #555; font-size: 18px; }
    .chat-body {
      flex: 1;
      overflow-y: auto;
      padding: 16px 14px 24px;
    }
    .divider { text-align: center; margin: 14px 0; }
    .divider span {
      display: inline-block;
      background: #dadada;
      color: #fff;
      font-size: 12px;
      padding: 3px 10px;
      border-radius: 4px;
    }
    .system-msg { text-align: center; margin: 14px 0; }
    .system-msg span {
      display: inline-block;
      color: #a5a5a5;
      font-size: 12px;
      padding: 2px 10px;
      border-radius: 4px;
    }
    .row {
      display: flex;
      gap: 10px;
      margin: 14px 0;
      align-items: flex-start;
    }
    .row.self { flex-direction: row-reverse; }
    .avatar {
      width: 38px; height: 38px;
      border-radius: 5px;
      flex-shrink: 0;
      color: #fff;
      font-size: 16px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
      object-fit: cover;
    }
    .col { max-width: 72%; display: flex; flex-direction: column; }
    .row.self .col { align-items: flex-end; }
    .nickname {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 4px;
      padding: 0 2px;
    }
    .row.self .nickname { display: none; }
    .bubble {
      background: var(--other-bubble);
      padding: 9px 13px;
      border-radius: 6px;
      font-size: 15px;
      line-height: 1.6;
      color: var(--text);
      position: relative;
      word-break: break-word;
      white-space: pre-wrap;
    }
    .bubble::before {
      content: "";
      position: absolute;
      top: 13px;
      left: -5px;
      width: 10px; height: 10px;
      background: inherit;
      transform: rotate(45deg);
      border-radius: 2px;
    }
    .row.self .bubble { background: var(--self-bubble); }
    .row.self .bubble::before { left: auto; right: -5px; }
    .bubble img.chat-img {
      max-width: 220px;
      border-radius: 6px;
      display: block;
      cursor: pointer;
    }
    .load-error {
      text-align: center;
      color: #a5a5a5;
      font-size: 14px;
      padding: 40px 0;
    }
  </style>
</head>
<body>
  <div class="phone">
    <div class="chat-header">
      <a class="back" href="index.html">‹</a>
      <span class="title" id="groupTitle">加载中…</span>
      <span class="more">···</span>
    </div>
    <div class="chat-body" id="chatBody"></div>
  </div>

<script>
/* ==================== 通用聊天页（不用改这个文件） ====================
 * 数据全部放在 data/ 目录下的 js 文件里，每个文件对应一段记录。
 * 访问方式：chat.html?id=文件名
 *   例如 chat.html?id=friends 会加载 data/friends.js
 * 新增一段记录：在 data/ 下照抄 friends.js 新建一个文件，
 * 然后去 index.html 目录页加一张卡片即可。
 * ================================================================ */

const AVATAR_COLORS = ["#5b8ff9","#5ad8a6","#f6bd16","#e8684a","#6dc8ec","#9270ca","#ff9d4d","#269a99","#ff99c3","#a0d911"];
function colorFor(name) {
  let h = 0;
  for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) >>> 0;
  return AVATAR_COLORS[h % AVATAR_COLORS.length];
}

const body = document.getElementById("chatBody");
const params = new URLSearchParams(location.search);
const id = (params.get("id") || "").replace(/[^a-zA-Z0-9_-]/g, ""); // 防路径穿越

if (!id) {
  document.getElementById("groupTitle").textContent = "未指定记录";
  body.innerHTML = '<div class="load-error">请从<a href="index.html">目录页</a>选择一段聊天记录</div>';
} else {
  const script = document.createElement("script");
  script.src = "data/" + id + ".js";
  script.onload = renderChat;
  script.onerror = () => {
    document.getElementById("groupTitle").textContent = "记录不存在";
    body.innerHTML = '<div class="load-error">没有找到这段记录，检查 data/' + id + '.js 是否存在</div>';
  };
  document.head.appendChild(script);
}

function renderChat() {
  const data = window.CHAT_DATA;
  if (!data) return;
  document.title = data.title;
  document.getElementById("groupTitle").textContent = data.title;

  for (const m of data.messages) {
    if (m.type === "time") {
      body.insertAdjacentHTML("beforeend",
        `<div class="divider"><span>${m.text}</span></div>`);
    } else if (m.type === "system") {
      body.insertAdjacentHTML("beforeend",
        `<div class="system-msg"><span>${m.text}</span></div>`);
    } else if (m.type === "msg") {
      const initial = m.name.trim().charAt(0).toUpperCase();
      const avatarHTML = m.avatar
        ? `<img class="avatar" src="${m.avatar}" alt="">`
        : `<div class="avatar" style="background:${colorFor(m.name)}">${initial}</div>`;
      // 图片消息：有 img 字段时显示图片，caption 作为附言
      let bubbleHTML;
      if (m.img) {
        bubbleHTML = `<img class="chat-img" src="${m.img}" alt="" onclick="window.open(this.src)">`
          + (m.text ? `<div style="margin-top:6px">${m.text}</div>` : "");
      } else {
        bubbleHTML = m.text;
      }
      const row = document.createElement("div");
      row.className = "row" + (m.self ? " self" : "");
      row.innerHTML = `
        ${avatarHTML}
        <div class="col">
          <div class="nickname">${m.name}</div>
          <div class="bubble">${bubbleHTML}</div>
        </div>`;
      body.appendChild(row);
    }
  }
  body.scrollTop = body.scrollHeight;
}
</script>
</body>
</html>
